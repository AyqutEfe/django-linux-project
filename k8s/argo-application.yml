apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://AyqutEfe.github.io/django-linux-project
    chart: django-chart
    targetRevision: "0.1.0"
    helm:
      values: |
        image:
          repository: ayqutfe/django-multistage
          tag: "v3"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true