replicaCount: 2

image:
    repository: django-multistage
    pullPolicy: IfNotPresent
    tag: "v3"

ingress:
    enabled: true
    className: "nginx"
    annotations:
        cert-manager.io/cluster-issuer: "selfsigned-issuer"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
        - host: django.portvmind.local
          paths:
              - path: /
                pathType: Prefix
    tls:
        - secretName: django-tls-secret
          hosts:
              - django.portvmind.local

service:
    type: ClusterIP
    port: 8000

resources:
    requests:
        cpu: 50m
        memory: 64Mi
    limits:
        cpu: 200m
        memory: 256Mi